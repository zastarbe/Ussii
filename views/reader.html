<body><header class="top"><div class="left"><a class="back" href="/">‹ Biblioteca</a><span class="sep">/</span><div class="title-wrap"><div class="title" id="title">Cargando…</div><div class="description" id="description"></div></div></div><div class="actions"><button class="tool" id="fullscreen">⛶ Pantalla completa</button></div></header><main class="stage" id="stage"><button class="side-arrow left-arrow hidden" id="prevArrow" aria-label="Página anterior" title="Página anterior">‹</button><button class="side-arrow right-arrow hidden" id="nextArrow" aria-label="Página siguiente" title="Página siguiente">›</button><button class="stage-share hidden" id="shareBook" type="button">↗ Compartir</button><div class="book" id="flipbook"></div><div class="brand-logo hidden" id="brandLogo"><img src="/assets/ceinpro-logo.png" alt="CEINPRO"></div><div class="loader" id="loader"><div><div class="spinner"></div><div id="loadText">Cargando publicación…</div></div></div></main><nav class="thumb-dock hidden" id="thumbDock" aria-label="Miniaturas de páginas"><div class="thumb-track" id="thumbTrack"></div></nav><footer class="bottom"><button class="nav" id="prev" aria-label="Página anterior">‹</button><div class="counter" id="counter">— / —</div><button class="nav" id="next" aria-label="Página siguiente">›</button><div class="zoom-control"><button class="zoom-btn" id="zoomOut" title="Alejar">−</button><input class="zoom-range" id="zoomRange" type="range" min="0" max="100" value="0" aria-label="Zoom, de ajustar a pantalla a 400 por ciento"><button class="zoom-btn" id="zoomIn" title="Acercar">+</button><span id="zoomLabel" class="zoom-label">Ajustar</span></div></footer><div class="progress" id="progress"></div><div class="hint">Arrastra una esquina o la página para hojear · ← →</div>
<script>
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=s=>document.querySelector(s), slug=location.pathname.slice(1), host=$('#flipbook'), stage=$('#stage');let pdf,pageFlip,total=0,zoom=1,baseSize=null,urls=[],bookSettings={};let autoTimer=null;if(new URLSearchParams(location.search).get('embed')==='1')document.body.classList.add('embed-mode');
function makeBookSize(){const w=Math.max(160,stage.clientWidth-24),h=Math.max(200,stage.clientHeight-20);const layout=(bookSettings.pageMode==='auto'||!bookSettings.pageMode)?(window.innerWidth>700?'double':'single'):bookSettings.pageMode;const landscape=layout==='double';let bw,bh;if(landscape){bh=Math.min(h,w*.69);bw=bh*1.43}else{bw=Math.min(w,h*.72);bh=bw*1.4}if(zoom===1||!baseSize)baseSize={width:bw,height:bh};const b=baseSize;host.style.width=Math.round(b.width*zoom)+'px';host.style.height=Math.round(b.height*zoom)+'px';if(pageFlip)pageFlip.update();requestAnimationFrame(()=>stage.scrollTo({left:Math.max(0,(host.offsetWidth-stage.clientWidth)/2),top:Math.max(0,(host.offsetHeight-stage.clientHeight)/2),behavior:'auto'}));updateZoomLabel()}
function zoomValue(){return Number($('#zoomRange').value)||0}let shareUrl='';async function sharePublication(){const data={title:$('#title').textContent,text:$('#description').textContent||'Lee esta publicación',url:shareUrl};if(navigator.share){try{await navigator.share(data);return}catch(e){if(e.name==='AbortError')return}}try{await navigator.clipboard.writeText(shareUrl);const b=$('#shareBook');const old=b.textContent;b.textContent='Enlace copiado ✓';setTimeout(()=>b.textContent=old,1600)}catch{prompt('Copia el enlace de la publicación:',shareUrl)}}$('#shareBook').onclick=sharePublication;$('#prevArrow').onclick=()=>pageFlip?.flipPrev();$('#nextArrow').onclick=()=>pageFlip?.flipNext();function updateZoomLabel(){$('#zoomLabel').textContent=zoomValue()===0?'Ajustar':`${Math.round(100+zoomValue()*3)}%`}function fitBook(reset=false){if(reset)$('#zoomRange').value='0';zoom=1+zoomValue()*.03;makeBookSize()}function setZoomFromSlider(){zoom=1+zoomValue()*.03;makeBookSize()}$('#zoomRange').addEventListener('input',setZoomFromSlider);$('#zoomIn').onclick=()=>{$('#zoomRange').value=String(Math.min(100,zoomValue()+10));setZoomFromSlider()};$('#zoomOut').onclick=()=>{$('#zoomRange').value=String(Math.max(0,zoomValue()-10));setZoomFromSlider()};$('#prev').onclick=()=>pageFlip?.flipPrev();$('#next').onclick=()=>pageFlip?.flipNext();
async function toggleFullscreen(){if(!document.fullscreenElement)await stage.requestFullscreen?.();else await document.exitFullscreen?.()}$('#fullscreen').onclick=toggleFullscreen;
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')pageFlip?.flipNext();if(e.key==='ArrowLeft')pageFlip?.flipPrev();if(e.key.toLowerCase()==='f')toggleFullscreen();if((e.ctrlKey||e.metaKey)&&['+','=','-','0'].includes(e.key)){e.preventDefault();if(e.key==='0')$('#zoomRange').value='0';else $('#zoomRange').value=String(Math.max(0,Math.min(100,zoomValue()+(e.key==='-'?-5:5))));setZoomFromSlider()}});
stage.addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();$('#zoomRange').value=String(Math.max(0,Math.min(100,zoomValue()+(e.deltaY<0?3:-3))));setZoomFromSlider()}},{passive:false});
function pageLabel(index){if(!total)return '— / —';if(pageFlip?.getOrientation()==='portrait')return `${index+1} / ${total}`;const hasCover=bookSettings.uniformCovers===false;const from=hasCover?(index===0?1:index+1):index+1;const to=hasCover&&index===0?1:Math.min(total,index+2);return `${from}${to!==from?'–'+to:''} / ${total}`}
function pageChanged(e){const i=Number(e.data)||0;const portrait=pageFlip?.getOrientation()==='portrait';const hasCover=bookSettings.uniformCovers===false;const lastStart=portrait?total-1:(hasCover?(total%2===0?total-1:Math.max(0,total-2)):(total%2===0?Math.max(0,total-2):total-1));const reached=portrait?i+1:(hasCover&&i===0?1:Math.min(total,i+2));$('#counter').textContent=pageLabel(i);$('#prev').disabled=i<=0;$('#next').disabled=i>=lastStart;$('#progress').style.width=`${Math.min(100,(reached/total)*100)}%`;updateThumbs(i);if(bookSettings.autoflip&&i>=lastStart)stopAutoflip()}
function stopAutoflip(){if(autoTimer){clearInterval(autoTimer);autoTimer=null}}function startAutoflip(){stopAutoflip();if(!bookSettings.autoflip)return;autoTimer=setInterval(()=>{if($('#next').disabled){stopAutoflip();return}pageFlip?.flipNext('top')},Math.max(2,Number(bookSettings.autoflipInterval)||5)*1000)}
function updateThumbs(index){const landscape=pageFlip?.getOrientation()==='landscape';const visible=new Set([index]);if(landscape&&(bookSettings.uniformCovers!==false||index>0)&&index+1<total)visible.add(index+1);document.querySelectorAll('.thumb').forEach((el,i)=>{const active=visible.has(i);el.classList.toggle('active',active);el.setAttribute('aria-current',active?'page':'false');if(active&&el.dataset.autoscroll==='1')el.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});});document.querySelectorAll('.thumb').forEach(el=>el.dataset.autoscroll='1')}
function canvasToBlob(canvas){return new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.9))}
async function renderImages(){const images=[];for(let i=1;i<=total;i++){const p=await pdf.getPage(i);const original=p.getViewport({scale:1});const scale=Math.min(2.0,1500/original.width,1800/original.height);const viewport=p.getViewport({scale});const canvas=document.createElement('canvas');canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);await p.render({canvasContext:canvas.getContext('2d',{alpha:false}),viewport,background:'#f4f0e7'}).promise;const blob=await canvasToBlob(canvas);if(!blob)throw Error(`No se pudo procesar la página ${i}.`);const url=URL.createObjectURL(blob);urls.push(url);images.push(url);canvas.width=1;canvas.height=1;$('#loadText').textContent=`Preparando páginas ${i} de ${total}…`;await new Promise(r=>setTimeout(r,0));}return images}
async function init(){try{if(!window.pdfjsLib)throw Error('No se pudo cargar PDF.js. Comprueba la conexión a Internet.');if(!window.St?.PageFlip)throw Error('No se pudo cargar el motor de pasar página.');const books=await fetch('/api/books').then(r=>r.json());const meta=books.find(b=>b.slug===slug);if(!meta)throw Error('No se encontró esta publicación.');bookSettings=meta;shareUrl=location.origin+meta.url;$('#title').textContent=meta.title;$('#description').textContent=meta.description||'';$('#description').classList.toggle('hidden',!meta.description);document.documentElement.style.setProperty('--reader-bg',/^#[0-9a-f]{6}$/i.test(meta.backgroundColor||'')?meta.backgroundColor:'#00745b');$('#brandLogo').classList.toggle('hidden',!meta.showLogo);$('#prevArrow').classList.toggle('hidden',meta.showArrows===false);$('#nextArrow').classList.toggle('hidden',meta.showArrows===false);$('#shareBook').classList.toggle('hidden',meta.showShare===false);pdf=await pdfjsLib.getDocument(meta.fileUrl).promise;total=pdf.numPages;bookSettings.startPage=Math.max(1,Math.min(total,Number(meta.startPage)||1));$('#loadText').textContent=`Preparando ${total} páginas…`;const images=await renderImages();const pages=images.map((src,i)=>{const el=document.createElement('div');el.className='page'+(bookSettings.uniformCovers===false&&(i===0||i===images.length-1)?' hard':'');if(bookSettings.uniformCovers===false&&(i===0||i===images.length-1))el.dataset.density='hard';const img=document.createElement('img');img.src=src;img.alt=`Página ${i+1}`;img.draggable=false;el.appendChild(img);return el});host.replaceChildren(...pages);zoom=1+zoomValue()*.03;makeBookSize();pageFlip=new St.PageFlip(host,{width:550,height:770,size:'stretch',minWidth:140,maxWidth:5000,minHeight:200,maxHeight:6000,drawShadow:true,flippingTime:1050,usePortrait:bookSettings.pageMode!=='double',startPage:bookSettings.startPage-1,autoSize:false,maxShadowOpacity:.92,showCover:bookSettings.uniformCovers===false,mobileScrollSupport:false,showPageCorners:true,swipeDistance:18,useMouseEvents:true});pageFlip.on('flip',pageChanged);pageFlip.on('init',e=>pageChanged({data:e.data?.page??pageFlip.getCurrentPageIndex()}));pageFlip.on('changeOrientation',()=>pageChanged({data:pageFlip.getCurrentPageIndex()}));pageFlip.loadFromHTML(host.querySelectorAll('.page'));const track=$('#thumbTrack');track.replaceChildren(...images.map((src,i)=>{const button=document.createElement('button');button.type='button';button.className='thumb';button.title=`Ir a la página ${i+1}`;button.setAttribute('aria-label',`Ir a la página ${i+1}`);button.innerHTML=`<img src="${src}" alt=""><span>${i+1}</span>`;button.onclick=()=>pageFlip.flip(i,'top');return button}));if(meta.showThumbnails!==false)$('#thumbDock').classList.remove('hidden');$('#loader').classList.add('hidden');fitBook(false);startAutoflip()}catch(e){$('#loader').innerHTML=`<div class="error"><h2>No se pudo abrir el PDF</h2><p>${String(e.message||e)}</p><a href="/">Volver a la biblioteca</a></div>`}}
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{baseSize=null;makeBookSize()},120)});window.addEventListener('beforeunload',()=>urls.forEach(URL.revokeObjectURL));init();
</script></body></html>
