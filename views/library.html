<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f1e9"><title>Biblioteca digital</title><style>
:root{--ink:#17231f;--muted:#738078;--paper:#f6f4ee;--green:#315b49;--line:#e5e1d7}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.shell{max-width:1160px;margin:auto;padding:25px clamp(16px,4vw,44px) 60px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:5px 0 19px}.brand{display:flex;align-items:center;gap:11px;font-size:17px;font-weight:760;letter-spacing:-.03em}.mark{width:34px;height:34px;border-radius:10px;background:var(--green);color:white;display:grid;place-items:center}.top img{width:108px;height:auto;max-width:25vw}.hero{padding:42px 0 27px}.eyebrow{color:var(--green);font-size:11px;font-weight:750;letter-spacing:.16em;text-transform:uppercase}.hero h1{font-size:clamp(30px,5vw,48px);letter-spacing:-.055em;line-height:1.05;margin:9px 0}.hero p{color:var(--muted);max-width:650px;margin:0}.crumb{margin:0 0 16px;font-size:13px;color:var(--muted)}.crumb a{color:var(--green);text-decoration:none}.section-head{display:flex;align-items:center;justify-content:space-between;margin:25px 0 12px}.section-head h2{font-size:18px;letter-spacing:-.03em;margin:0}.count{color:var(--muted);font-size:12px}.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}.folder{min-height:104px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:13px;transition:.16s;box-shadow:0 8px 22px #20372b07}.folder:hover,.book:hover{transform:translateY(-2px);border-color:#b7c7bc;box-shadow:0 12px 26px #20372b12}.folder-icon{width:43px;height:40px;border-radius:11px;background:#e8eee9;color:var(--green);display:grid;place-items:center;font-size:20px;flex:0 0 auto}.folder strong{display:block;font-size:14px}.folder small{color:var(--muted);font-size:11px}.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px}.book{overflow:hidden;background:white;border:1px solid var(--line);border-radius:13px;text-decoration:none;color:inherit;transition:.16s;box-shadow:0 8px 22px #20372b07}.book-cover{height:142px;background:linear-gradient(145deg,#e4eee8,#dce7df);display:grid;place-items:center;position:relative;overflow:hidden}.book-cover img{width:100%;height:100%;object-fit:cover}.book-cover .fake{width:76px;height:102px;border-radius:4px 8px 8px 4px;background:linear-gradient(145deg,#4e8065,#254b39);box-shadow:inset 5px 0 #ffffff2a,3px 5px 10px #17352640;display:grid;place-items:center;color:#ffffffc9;font-size:26px}.book-copy{padding:13px 14px 15px}.book-copy strong{display:block;font-size:14px;line-height:1.3}.book-copy p{font-size:12px;color:var(--muted);margin:6px 0 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.open{display:block;margin-top:10px;color:var(--green);font-size:12px;font-weight:750}.empty{padding:28px 16px;text-align:center;border:1px dashed #d8d5cb;border-radius:12px;color:var(--muted);font-size:13px}.hidden{display:none!important}.footer{margin-top:45px;padding-top:15px;border-top:1px solid var(--line);font-size:11px;color:#98a098;text-align:center}@media(max-width:550px){.hero{padding:32px 0 20px}.folders,.books{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.book-cover{height:115px}.book-copy{padding:10px}.folder{padding:12px;gap:9px}.folder-icon{width:36px;height:36px}.top img{width:90px}}
</style></head><body><main class="shell"><header class="top"><div class="brand"><div class="mark">▤</div>Biblioteca digital</div><img src="/assets/ceinpro-logo.png" alt="CEINPRO"></header><section class="hero"><div class="eyebrow" id="eyebrow">Colección</div><h1 id="heading">Publicaciones</h1><p id="intro">Explora las publicaciones y abre cada PDF en el lector interactivo.</p></section><div id="crumb" class="crumb hidden"></div><section id="folderSection"><div class="section-head"><h2>Carpetas</h2><span id="folderCount" class="count"></span></div><div id="folders" class="folders"></div></section><section><div class="section-head"><h2 id="booksHeading">Publicaciones</h2><span id="bookCount" class="count"></span></div><div id="books" class="books"></div></section><footer class="footer">Estantería digital · Lectura interactiva de documentos PDF</footer></main><script>
const $=s=>document.querySelector(s);function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const path=location.pathname,folderSlug=path.startsWith('/carpeta/')?decodeURIComponent(path.slice('/carpeta/'.length)):'',folderUrl=s=>'/carpeta/'+encodeURIComponent(s);
(async()=>{try{const [folders,books]=await Promise.all([fetch('/api/folders').then(r=>r.json()),fetch('/api/books').then(r=>r.json())]);const current=folders.find(f=>f.slug===folderSlug);if(folderSlug&&!current)throw Error('No se encontró esta carpeta.');if(current){$('#eyebrow').textContent='Carpeta';$('#heading').textContent=current.name;$('#intro').textContent='Publicaciones agrupadas en esta carpeta.';$('#folderSection').classList.add('hidden');$('#booksHeading').textContent='Publicaciones';$('#crumb').innerHTML=`<a href="/">Biblioteca</a> / ${esc(current.name)}`;$('#crumb').classList.remove('hidden')}else{$('#folderCount').textContent=`${folders.length} ${folders.length===1?'carpeta':'carpetas'}`;$('#folders').innerHTML=folders.length?folders.map(f=>`<a class="folder" href="${folderUrl(f.slug)}"><span class="folder-icon">▱</span><span><strong>${esc(f.name)}</strong><small>${f.count||0} ${(f.count||0)===1?'publicación':'publicaciones'}</small></span></a>`).join(''):'<div class="empty" style="grid-column:1/-1">Todavía no hay carpetas.</div>'}const list=current?books.filter(b=>b.folderSlug===current.slug):books.filter(b=>!b.folderSlug);$('#bookCount').textContent=`${list.length} ${list.length===1?'publicación':'publicaciones'}`;$('#books').innerHTML=list.length?list.map(b=>`<a class="book" href="${esc(b.url)}"><div class="book-cover"><span class="fake">▤</span></div><div class="book-copy"><strong>${esc(b.title)}</strong>${b.description?`<p>${esc(b.description)}</p>`:''}<span class="open">Abrir publicación →</span></div></a>`).join(''):'<div class="empty" style="grid-column:1/-1">No hay publicaciones aquí todavía.</div>'}catch(e){$('#heading').textContent='No disponible';$('#intro').textContent=e.message}})();
</script></body></html>
