<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Acceso privado — Estantería</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f3f1e9;color:#1d2b25;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:20px}.card{width:min(410px,100%);background:white;border:1px solid #e4e1d8;border-radius:18px;padding:30px;box-shadow:0 18px 60px #14201812}.logo{display:flex;align-items:center;gap:11px;font-weight:750;font-size:17px}.mark{width:34px;height:34px;display:grid;place-items:center;background:#315b49;color:white;border-radius:10px}.tag{color:#668075;font-size:11px;text-transform:uppercase;letter-spacing:.16em;margin-top:28px;font-weight:700}.card h1{font-size:29px;line-height:1.1;letter-spacing:-.04em;margin:9px 0}.card p{color:#6f7c74;font-size:13px;margin:0 0 22px}.card label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}.card input{width:100%;padding:13px;border:1px solid #dedbd2;border-radius:9px;font:inherit;outline:none}.card input:focus{border-color:#60937b;box-shadow:0 0 0 3px #315b4912}.btn{width:100%;border:0;border-radius:9px;background:#315b49;color:white;padding:13px;font:700 14px system-ui;cursor:pointer;margin-top:14px}.error{color:#b74036;background:#fff1ef;border-radius:8px;padding:10px 12px;font-size:12px;margin-bottom:13px}.foot{text-align:center;color:#929b94;font-size:11px;margin-top:22px}
</style></head><body><main class="card"><div class="logo"><div class="mark">▤</div>Estantería digital</div><div class="tag">Acceso restringido</div><h1>Administración</h1><p>Esta zona es privada. Inicia sesión para gestionar publicaciones y carpetas.</p><form method="post" action="/admin/login"><label for="password">Contraseña de administrador</label><input id="password" name="password" type="password" autocomplete="current-password" required autofocus><button class="btn" type="submit">Entrar</button></form><div class="foot"><a href="/" style="color:#315b49">Volver a la biblioteca pública</a></div></main><script>if(new URLSearchParams(location.search).has('error'))document.querySelector('form').insertAdjacentHTML('beforebegin','<div class="error">La contraseña no es correcta. Inténtalo de nuevo.</div>')</script></body></html>
